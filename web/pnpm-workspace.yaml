# Single-package project; this file only carries pnpm settings.

# vite-plus and its vite core ship as a pair. Bump both by hand together,
# in package.json and here. A split pair fails at startup.
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Supply-chain policy (mirrors carbon-fiber).
# New versions must be at least 4 days old before pnpm will resolve them.
minimumReleaseAge: 5760

# No dependency may run lifecycle scripts unless reviewed and listed here.
strictDepBuilds: true
allowBuilds: {}

# Transitive dependencies must come from the registry, not git or tarballs.
blockExoticSubdeps: true

# Refuse versions whose publisher trust level regressed.
trustPolicy: no-downgrade

# Keep node_modules in sync with the lockfile before running scripts.
verifyDepsBeforeRun: install

# Fail install on an engines mismatch instead of warning.
engineStrict: true
