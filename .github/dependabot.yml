version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Mirrors pnpm's minimumReleaseAge (5760 min): don't propose versions younger than 4 days.
    cooldown:
      default-days: 4
    groups:
      # vite-plus and its vite core need a manual bump together. See web/pnpm-workspace.yaml.
      vite-plus:
        patterns: ["vite", "vite-plus", "@voidzero-dev/vite-plus-core"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 4

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
